name: Test

# Runs on every PR, and is called by deploy.yml so main is gated on the exact
# same checks.
on:
  pull_request:
  workflow_call:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run API tests
        run: docker compose --profile test run --rm test

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run MCP server tests
        run: docker compose --profile test run --rm --build mcp-test

  caddy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate the production Caddyfile
        run: ./deploy/test-caddy.sh

  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Test deploy.sh and the pre-migration dump
        run: ./deploy/test-deploy.sh

  # The UI's tests, types and lint gate merges and deploys too (T-08-16).
  # Same Node major as ui/Dockerfile and deploy/ui.Dockerfile (Node 24, the
  # active LTS), so CI tests what ships. Move all of them together.
  # node:24 (Debian), not node:24-alpine like the Dockerfiles: JavaScript
  # actions such as actions/checkout don't run in Alpine job containers.
  ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container: node:24
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install (lockfile only, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npx vitest run
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build (catches what tsc alone doesn't)
        run: npm run build

  # The production UI image (deploy/ui.Dockerfile) is built here too, so a
  # broken image shows on the PR, not on the next deploy.
  ui-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the production UI image
        run: docker build -f deploy/ui.Dockerfile -t ui-image-check .

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Self-test the workflow checks
        run: python3 .github/scripts/test_check_workflows.py
      - name: Audit ignore list and npm gate
        run: python3 .github/scripts/test_audit_gate.py
      - name: Actions pinned to SHAs; the audit can't fail silently
        run: python3 .github/scripts/check_workflows.py .github/workflows
